(()=>{const track=document.querySelector('.ig-track'),count=document.querySelector('.ig-count'),play=document.querySelector('#ig-play');let slides=[...track.children],index=0,timer=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)');function go(n){if(n>index&&track.scrollLeft>=track.scrollWidth-track.clientWidth-2)n=0;index=(n+slides.length)%slides.length;track.scrollTo({left:slides[index].offsetLeft-slides[0].offsetLeft,behavior:reduced.matches?'instant':'smooth'});count.textContent=(index+1)+' / '+slides.length;}function stop(){clearInterval(timer);timer=null;play.textContent='自動播放';play.setAttribute('aria-pressed','false');}document.querySelector('#ig-prev').addEventListener('click',()=>{stop();go(index-1);});document.querySelector('#ig-next').addEventListener('click',()=>{stop();go(index+1);});play.addEventListener('click',()=>{if(timer){stop();return;}timer=setInterval(()=>go(index+1),7000);play.textContent='暫停播放';play.setAttribute('aria-pressed','true');});track.addEventListener('scroll',()=>{index=slides.reduce((best,el,i)=>Math.abs(el.offsetLeft-slides[0].offsetLeft-track.scrollLeft)<Math.abs(slides[best].offsetLeft-slides[0].offsetLeft-track.scrollLeft)?i:best,0);count.textContent=(index+1)+' / '+slides.length;},{passive:true});let drag=null,suppressClick=false;track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;stop();drag={x:e.clientX,left:track.scrollLeft,moved:false,id:e.pointerId};suppressClick=false;});track.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5&&!drag.moved){drag.moved=true;track.classList.add('dragging');track.setPointerCapture(e.pointerId);}if(drag.moved){e.preventDefault();track.scrollLeft=drag.left-dx;}});function finishDrag(){if(!drag)return;suppressClick=drag.moved;const id=drag.id;drag=null;track.classList.remove('dragging');if(track.hasPointerCapture(id))track.releasePointerCapture(id);if(suppressClick){const target=slides.reduce((best,el,i)=>Math.abs(el.offsetLeft-slides[0].offsetLeft-track.scrollLeft)<Math.abs(slides[best].offsetLeft-slides[0].offsetLeft-track.scrollLeft)?i:best,0);go(target);}}track.addEventListener('pointerup',finishDrag);track.addEventListener('pointercancel',finishDrag);track.addEventListener('pointerleave',()=>{if(drag&&!drag.moved)drag=null;});track.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation();suppressClick=false;}},true);track.addEventListener('dragstart',e=>e.preventDefault());track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stop();go(index+(e.key==='ArrowRight'?1:-1));}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
async function refreshInstagram(){
 const config=JSON.parse(document.getElementById('instagram-feed-config').textContent);
 if(!config.feedUrl)return;
 const endpoint=new URL(config.feedUrl);if(endpoint.protocol!=='https:'||endpoint.hostname!=='feeds.behold.so')return;
 try{
  const response=await fetch(endpoint.href,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw new Error('Feed unavailable');
  const data=await response.json();if(data.username!=='cingaryee'||!Array.isArray(data.posts))throw new Error('Incorrect Instagram account');
  const posts=data.posts.slice(0,6);const fragment=document.createDocumentFragment();const images=[];
  for(const [i,post] of posts.entries()){
   const link=new URL(post.permalink);if(link.protocol!=='https:'||!['www.instagram.com','instagram.com'].includes(link.hostname))throw new Error('Invalid post');
   const source=post.sizes?.medium?.mediaUrl||post.sizes?.small?.mediaUrl||(post.mediaType==='VIDEO'?post.thumbnailUrl:post.mediaUrl);
   const imageUrl=new URL(source);if(imageUrl.protocol!=='https:')throw new Error('Invalid image');
   const a=document.createElement('a');a.className='ig-slide';a.href=link.href;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','在 Instagram 查看作品 '+(i+1));
   const img=document.createElement('img');img.src=imageUrl.href;img.alt=post.altText||'毛毛聊 Instagram 作品 '+(i+1);img.width=640;img.height=640;img.draggable=false;a.append(img);fragment.append(a);images.push(img);
  }
  if(!images.length)return;await Promise.all(images.map(img=>img.decode()));
  stop();track.replaceChildren(fragment);slides=[...track.children];index=0;track.scrollLeft=0;count.textContent='1 / '+slides.length;track.dataset.feed='live';
 }catch(error){console.warn('Instagram feed could not refresh; retaining existing artwork.');}
}
refreshInstagram();
})();
